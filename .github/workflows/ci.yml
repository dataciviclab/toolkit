name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          python-version: ${{ matrix.python-version }}
          extra-packages: -e ".[dev]"
      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "."
          mypy_paths: "toolkit/"
          test_dir: "tests"
          pytest_args: "-p pytest_cov -n auto -q -p no:cacheprovider -m \"not smoke\""
          cov_module: "toolkit"
          cov_report: "term-missing --cov-report=xml"
          cov_threshold: "81"
      - name: Upload Coverage Artifact
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
      - name: Install And CLI Smoke
        if: ${{ hashFiles('scripts/smoke_install_cli.py') != '' }}
        run: python scripts/smoke_install_cli.py
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          python-version: "3.12"
          extra-packages: build twine
      - name: Build Distributions
        run: python -m build
      - name: Twine Check
        run: python -m twine check dist/*
